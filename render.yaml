# Blueprint do Render — provisiona a API e o PostgreSQL de uma vez.
#
# A API do RetroBook e um servico HTTP persistente com pool de conexoes do
# Prisma e rate limit em memoria. Isso NAO cabe bem em funcao serverless: cada
# invocacao fria abriria um pool novo (esgotando as conexoes do Postgres) e o
# rate limit contaria por instancia, virando decoracao. Por isso a API fica em
# um servico de processo longo, e so o frontend estatico vai para a Vercel.
services:
  - type: web
    name: retrobook-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # `--include=dev` e obrigatorio: NODE_ENV=production faz o npm pular as
    # devDependencies, e o build precisa do TypeScript para compilar. Sem essa
    # flag o Blueprint falha no primeiro build, e o erro ("tsc: not found") nao
    # deixa obvio que a causa foi uma variavel de ambiente.
    buildCommand: npm install --include=dev && npm run build --workspace @retrobook/api
    # A sequencia de boot vive no script `start` do pacote, e nao aqui, de
    # proposito: assim ela vale mesmo que o Blueprint nao sincronize este
    # arquivo. Ela faz, em ordem:
    #
    #  1. migrate deploy -- idempotente; garante que o schema nunca fique
    #     atras do codigo que acabou de subir.
    #  2. seed do catalogo -- tambem idempotente e sem um unico delete. Roda a
    #     cada boot porque o free tier do Render nao da shell para rodar um
    #     comando avulso, e sem catalogo (generos, livros, planos) o produto
    #     nao tem o que mostrar. A falha dele NAO derruba a API: catalogo
    #     incompleto e ruim, API fora do ar e pior.
    #  3. o processo.
    startCommand: npm run start --workspace @retrobook/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: retrobook-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Preencher com a URL publica da Vercel apos o primeiro deploy do site.
      - key: WEB_ORIGIN
        sync: false
      # `none` porque site e API ficam em dominios diferentes. Ver docs/deployment.md.
      - key: COOKIE_SAMESITE
        value: none
      - key: BOOK_PROVIDER
        value: local

databases:
  - name: retrobook-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
