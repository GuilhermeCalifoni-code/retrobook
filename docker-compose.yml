services:
  postgres:
    image: postgres:16-alpine
    container_name: retrobook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retrobook
      POSTGRES_PASSWORD: retrobook
      POSTGRES_DB: retrobook
    ports:
      - "5433:5432"
    volumes:
      - retrobook-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrobook -d retrobook"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  retrobook-pgdata:
