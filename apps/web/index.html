<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7B2E3A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />

    <title>RetroBook — Leia. Encontre. Compartilhe.</title>
    <meta
      name="description"
      content="Descubra pessoas, comunidades e conversas a partir das historias que voce ama. O RetroBook conecta leitores pelos livros que eles leem."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RetroBook" />
    <meta property="og:title" content="RetroBook — Leia. Encontre. Compartilhe." />
    <meta
      property="og:description"
      content="Descubra pessoas, comunidades e conversas a partir das historias que voce ama."
    />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://retrobook.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Aplica o tema antes da primeira pintura para evitar o flash de tela clara.
      (function () {
        try {
          var stored = localStorage.getItem('retrobook.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'DARK' || ((!stored || stored === 'SYSTEM') && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
